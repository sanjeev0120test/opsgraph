name: ci

# Fast parallel quality gates. Wall-clock is the slowest job, not the sum.
# Ubuntu runs the full suite (race + 21-loop prove + module-graph rebuilds).
# Windows/macOS/arm64 use -short: same OS contracts, skip Linux-only burn.
# Target: ~3 minutes on cache hits (ubuntu race is the floor).
# Required aggregator job: "all checks passed".
# Tag pushes are owned by release.yml (skip here to avoid duplicate runners).

on:
  push:
    branches: ['**']
    tags-ignore: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel in-flight required jobs on main; cancel PR/branch supersessions.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - name: gofmt + vet + mod + build + hygiene
        run: |
          set -euo pipefail
          # Single-writer helper keeps shellcheck SC2129 clean with interleaved checks.
          sum() { printf '%s\n' "$@" >> "$GITHUB_STEP_SUMMARY"; }
          sum "## lint" "" "| check | result |" "| --- | --- |"
          fmtout="$(gofmt -l .)"
          if [ -n "$fmtout" ]; then
            echo "::error::gofmt drift — run gofmt -w on listed files"
            echo "Unformatted files:"; echo "$fmtout"
            sum "| gofmt | fail |"
            exit 1
          fi
          sum "| gofmt | ok |"
          go vet ./...
          # All vet analyzers (compile-only; no test execution).
          go test -count=1 -timeout=3m -vet=all -run=^$ ./...
          sum "| go vet (+ -vet=all) | ok |"
          test -s .gitattributes
          grep -Fq '* text=auto eol=lf' .gitattributes
          sum "| .gitattributes LF pin | ok |"
          go mod download
          go mod verify
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error::go.mod/go.sum drift — run go mod tidy"
            sum "| go mod tidy | fail |"
            exit 1
          fi
          sum "| go mod tidy | ok |"
          # Clean module graph: no replace/exclude hacks (portable, reproducible).
          if grep -E '^(replace|exclude)[[:space:]]|^replace \(|^exclude \(' go.mod; then
            echo "::error::go.mod must not contain replace/exclude directives"
            sum "| go.mod hygiene | fail |"
            exit 1
          fi
          sum "| go.mod hygiene | ok |"
          # Offline-first + locked module graph + no VCS stamp bleed for the production package.
          lint_bin="${RUNNER_TEMP}/opsgraph-lint"
          GOPROXY=off GOFLAGS="-mod=readonly -buildvcs=false" \
            go build -trimpath -ldflags="-s -w -buildid=" -o "$lint_bin" ./cmd/opsgraph
          GOPROXY=off GOFLAGS="-mod=readonly -buildvcs=false" go build ./...
          # Reproducible release stamp: -buildid= must leave an empty build ID.
          bid="$(go tool buildid "$lint_bin")"
          if [ -n "$bid" ]; then
            echo "::error::expected empty buildid from -ldflags=-buildid=, got: ${bid}"
            exit 1
          fi
          sum "| go build (GOPROXY=off, -mod=readonly, empty buildid) | ok |"
          # Precompiled binaries/archives belong in GitHub Releases only.
          tracked="$(git ls-files -z | tr '\0' '\n' | grep -E '(^|/)(bin|dist)/|(^|/)opsgraph(\.exe)?$|(^|/)opsgraph_.+\.(tar\.gz|zip)$|(^|/)SHA256SUMS$|(^|/)DEPENDENCIES\.txt$' || true)"
          if [ -n "$tracked" ]; then
            echo "found tracked binary/archive artifacts; remove them and publish via Releases:" >&2
            echo "$tracked" >&2
            exit 1
          fi
          shopt -s nullglob
          root_archives=(opsgraph_*.tar.gz opsgraph_*.zip)
          shopt -u nullglob
          if ((${#root_archives[@]} > 0)); then
            echo "release archives present in workspace root; do not commit them" >&2
            printf '%s\n' "${root_archives[@]}" >&2
            exit 1
          fi
          # License + installer presence (was a separate license workflow).
          test -s LICENSE
          grep -qi 'MIT License' LICENSE
          test -s SECURITY.md
          test -s CONTRIBUTING.md
          test -s .github/CODEOWNERS
          test -s scripts/install.sh
          test -s scripts/install.ps1
          test -s scripts/pack-release.sh
          test -s scripts/coverfloor.go
          test -s scripts/jsonassert.go
          test -s scripts/check_lf.go
          test -s scripts/check_fixtures.go
          head -n 1 scripts/install.sh | grep -qE '^#!/'
          head -n 1 scripts/pack-release.sh | grep -qE '^#!/'
          head -n 1 scripts/verify.sh | grep -qE '^#!/'
          # Shell scripts must stay POSIX-clean; pin shellcheck tarball by SHA256.
          curl -fsSL -o /tmp/shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz
          echo "6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          /tmp/shellcheck-v0.10.0/shellcheck -x \
            scripts/install.sh scripts/pack-release.sh scripts/verify.sh hack/kind-demo.sh
          # Pure-Go helpers used by pack-release / smoke must compile + self-check.
          go build -o /dev/null scripts/gomod_sbom.go
          go build -o /dev/null scripts/jsonassert.go
          go build -o /dev/null scripts/coverfloor.go
          go build -o /dev/null scripts/check_lf.go
          go build -o /dev/null scripts/check_fixtures.go
          printf '%s\n' '{"ok":true,"total":2,"name":"x"}' | go run ./scripts/jsonassert.go true:ok eqnum:total=2 eq:name=x gte:total=1
          # Determinism: golden + pack YAML/JSON must stay LF-only across OSes.
          go run ./scripts/check_lf.go \
            fixtures/incident_checkout/expected \
            fixtures/fleet_healthy/expected \
            fixtures/incident_checkout \
            fixtures/fleet_healthy
          # Structural integrity: required pack files + valid golden JSON.
          go run ./scripts/check_fixtures.go
          sum "| shellcheck (sha256-pinned) | ok |" "| jsonassert self-check | ok |" "| golden LF-only | ok |" "| fixture packs | ok |"
          # Live-connector smoke fixture must resolve its k8s snapshot.
          test -f fixtures/ci_live_k8s/.opsgraph.yaml
          test -d fixtures/incident_checkout/k8s
          test -f fixtures/incident_checkout/k8s/deployments.yaml
          test -f fixtures/fleet_healthy/meta.yaml
          test -f fixtures/fleet_healthy/services.yaml
          test -f fixtures/fleet_healthy/expected/ask_api.json
          test -f fixtures/fleet_healthy/expected/verify_api.json
          sum "| fixture hygiene | ok |"
      # PowerShell analysis does not need a Windows runner. Keep it off the
      # Windows test job so gallery install cannot pad the critical path.
      - name: PSScriptAnalyzer (installers)
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          $errs = @()
          foreach ($f in @('scripts/install.ps1', 'scripts/verify.ps1')) {
            $findings = Invoke-ScriptAnalyzer -Path $f -Severity @('Error', 'Warning') -ExcludeRule @(
              'PSAvoidUsingWriteHost',
              'PSUseShouldProcessForStateChangingFunctions',
              'PSUseBOMForUnicodeEncodedFile',
              'PSAvoidUsingEmptyCatchBlock'
            )
            if ($findings) {
              $findings | Format-Table -AutoSize | Out-String | Write-Host
              $errs += $findings
            }
          }
          if ($errs.Count -gt 0) { throw "PSScriptAnalyzer reported $($errs.Count) finding(s)" }

  staticcheck:
    name: staticcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - name: Run staticcheck + deadcode (go tool, sum-pinned)
        run: |
          set -euo pipefail
          # Pinned via go.mod tool directive (module graph + go.sum).
          go tool staticcheck ./...
          # deadcode exits 0 even when it prints findings on some runners; treat output as failure.
          dead="$(go tool deadcode -test ./...)"
          if [ -n "$dead" ]; then
            echo "$dead"
            echo "::error::deadcode found unreachable functions"
            exit 1
          fi
          echo "| staticcheck + deadcode | ok |" >> "$GITHUB_STEP_SUMMARY"

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            race: true
            smoke: full
          - os: macos-latest
            # Race+CGO covered on ubuntu; macos stays lean for install/smoke contracts.
            race: false
            smoke: compact
          - os: windows-latest
            race: false
            smoke: compact
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - name: Build binary
        shell: bash
        run: |
          set -euo pipefail
          out=bin/opsgraph
          if [ "${RUNNER_OS}" = Windows ]; then out=bin/opsgraph.exe; fi
          go build -trimpath -ldflags="-s -w -buildid=" -o "$out" ./cmd/opsgraph
          test -s "$out"
          # Pure-Go build proof: main module path + correct GOOS/GOARCH stamps.
          meta="$(go version -m "$out")"
          echo "$meta" | grep -F "github.com/sanjeev0120test/opsgraph/cmd/opsgraph" >/dev/null
          case "${RUNNER_OS}" in
            Linux) echo "$meta" | grep -F "GOOS=linux" >/dev/null ;;
            macOS) echo "$meta" | grep -F "GOOS=darwin" >/dev/null ;;
            Windows) echo "$meta" | grep -F "GOOS=windows" >/dev/null ;;
            *) echo "unsupported RUNNER_OS=${RUNNER_OS}" >&2; exit 1 ;;
          esac
          case "${RUNNER_ARCH}" in
            X64|AMD64) echo "$meta" | grep -F "GOARCH=amd64" >/dev/null ;;
            ARM64) echo "$meta" | grep -F "GOARCH=arm64" >/dev/null ;;
            *) echo "unsupported RUNNER_ARCH=${RUNNER_ARCH}" >&2; exit 1 ;;
          esac
      - name: Unit tests (shuffle, short)
        if: ${{ !matrix.race }}
        run: go test -count=1 -timeout=4m -short -shuffle=on -fullpath ./...
      - name: Unit tests (race + shuffle + cover)
        if: ${{ matrix.race && matrix.os == 'ubuntu-24.04' }}
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          # Prove the module cache alone is enough (offline-first) for the full test graph.
          GOPROXY=off GOFLAGS="-mod=readonly" \
            go test -count=1 -timeout=10m -race -shuffle=on -fullpath -coverprofile=cover.out -covermode=atomic ./...
          go tool cover -func=cover.out | tee cover-func.txt | go run ./scripts/coverfloor.go \
              total=64 \
              cmd/opsgraph=56 \
              internal/ai=45 \
              internal/ask=75 \
              internal/store=60
          tail -n 1 cover-func.txt | tee cover-summary.txt
          # Short deterministic fuzz budgets (no corpus commit required).
          go test -count=1 -timeout=2m -fuzz=FuzzOfStablePrefix -fuzztime=5s ./internal/fingerprint
          go test -count=1 -timeout=2m -fuzz=FuzzParse -fuzztime=5s ./internal/runbook
          go test -count=1 -timeout=2m -fuzz=FuzzServicesYAML -fuzztime=5s ./internal/ingest
          {
            echo "## coverage"
            echo ""
            echo '```'
            cat cover-summary.txt
            echo '```'
            echo ""
            echo "Floors: total>=64, cmd/opsgraph>=56, internal/ai>=45, internal/ask>=75, internal/store>=60"
            echo "Fuzz: fingerprint + runbook Parse + services YAML (5s each)"
            echo "Note: internal/deps is test-only (no statements); pure-Go/mod hygiene covered by deps tests + lint."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverprofile
        if: ${{ matrix.race && matrix.os == 'ubuntu-24.04' && always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverprofile-${{ github.run_id }}
          path: |
            cover.out
            cover-summary.txt
            cover-func.txt
          if-no-files-found: ignore
          retention-days: 7
      - name: Fixture / golden + demo
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/opsgraph
          if [ -f ./bin/opsgraph.exe ]; then BIN=./bin/opsgraph.exe; fi
          "$BIN" test ./fixtures/incident_checkout
          "$BIN" test ./fixtures/fleet_healthy
          "$BIN" validate-fixture ./fixtures/incident_checkout
          "$BIN" validate-fixture ./fixtures/fleet_healthy
          "$BIN" demo --format json >/dev/null
          # Determinism gate (was separate fixtures workflow).
          tmpdir="$(mktemp -d 2>/dev/null || mktemp -d -t opsgraph)"
          echo "SMOKE_TMP=$tmpdir" >> "$GITHUB_ENV"
          "$BIN" ask checkout --fixture ./fixtures/incident_checkout --format json > "$tmpdir/a.json"
          "$BIN" ask checkout --fixture ./fixtures/incident_checkout --format json > "$tmpdir/b.json"
          cmp -s "$tmpdir/a.json" "$tmpdir/b.json"
      - name: Upload smoke diffs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: smoke-failure-${{ matrix.os }}-${{ github.run_id }}
          path: |
            ${{ env.SMOKE_TMP }}
            bin/
          if-no-files-found: ignore
          retention-days: 7
      - name: Compact CLI smoke (macos/windows)
        if: ${{ matrix.smoke == 'compact' }}
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/opsgraph
          if [ -f ./bin/opsgraph.exe ]; then BIN=./bin/opsgraph.exe; fi
          "$BIN" ask checkout --fixture ./fixtures/incident_checkout --format json >/dev/null
          set +e
          "$BIN" ask nosuch --fixture ./fixtures/incident_checkout >/dev/null
          code=$?
          "$BIN" ask checkout >/dev/null
          nosrc=$?
          "$BIN" services --fixture ./fixtures/incident_checkout --health nope >/dev/null
          bad_health=$?
          set -e
          test "$code" -eq 1
          test "$nosrc" -eq 2
          test "$bad_health" -eq 2
          "$BIN" path checkout-api auth --fixture ./fixtures/incident_checkout >/dev/null
          "$BIN" doctor >/dev/null
          DATA="$(mktemp -d 2>/dev/null || mktemp -d -t opsgraph)"
          "$BIN" ingest --fixture ./fixtures/incident_checkout --data-dir "$DATA" >/dev/null
          "$BIN" ask checkout --data-dir "$DATA" --format json >/dev/null
          "$BIN" status --data-dir "$DATA" >/dev/null
          set +e
          EMPTY="$(mktemp -d 2>/dev/null || mktemp -d -t opsgraph-empty)"
          "$BIN" status --data-dir "$EMPTY" >/dev/null
          empty_status=$?
          set -e
          test "$empty_status" -eq 1
          "$BIN" ask checkout --config fixtures/ci_live_k8s/.opsgraph.yaml --format json >/dev/null
          # Graph must write mermaid to stdout (not stderr) so redirects work.
          "$BIN" graph --fixture ./fixtures/incident_checkout --format mermaid > "$DATA/mermaid.txt" 2>"$DATA/mermaid.err"
          test -s "$DATA/mermaid.txt"
          test ! -s "$DATA/mermaid.err"
          grep -F flowchart "$DATA/mermaid.txt" >/dev/null
          # Fixture clock must survive ingest -> --data-dir (generated_at parity).
          "$BIN" ask checkout --fixture ./fixtures/incident_checkout --format json > "$DATA/a.json"
          "$BIN" ask checkout --data-dir "$DATA" --format json > "$DATA/b.json"
          grep -F '"generated_at": "2026-07-31T12:00:00Z"' "$DATA/a.json" >/dev/null
          grep -F '"generated_at": "2026-07-31T12:00:00Z"' "$DATA/b.json" >/dev/null
          # On-call subset promoted from full smoke for cross-OS contracts.
          "$BIN" handoff checkout --fixture ./fixtures/incident_checkout >/dev/null
          "$BIN" why checkout --fixture ./fixtures/incident_checkout --format json >/dev/null
          "$BIN" explain checkout --fixture ./fixtures/incident_checkout --format json >/dev/null
          "$BIN" report checkout --fixture ./fixtures/incident_checkout --format json >/dev/null
          "$BIN" fingerprint checkout --fixture ./fixtures/incident_checkout >/dev/null
          "$BIN" compare checkout auth --fixture ./fixtures/incident_checkout >/dev/null
          set +e
          "$BIN" watch checkout --fixture ./fixtures/incident_checkout --interval -1s --timeout 1s >/dev/null
          bad_watch=$?
          "$BIN" ask checkout --fixture ./fixtures/incident_checkout --data-dir "$DATA" >/dev/null
          conflict=$?
          set -e
          test "$bad_watch" -eq 2
          test "$conflict" -eq 2
          "$BIN" status --fixture ./fixtures/incident_checkout | grep -F "ACTIVE SOURCE  fixture" >/dev/null
          "$BIN" validate-fixture ./fixtures/fleet_healthy >/dev/null
          "$BIN" health --fixture ./fixtures/fleet_healthy --strict >/dev/null
          "$BIN" ask api --fixture ./fixtures/fleet_healthy --format json >/dev/null
          # Cross-OS exit-code contracts (promoted from ubuntu-only full smoke).
          set +e
          "$BIN" verify-runbook checkout --fixture ./fixtures/incident_checkout >/dev/null
          vrb=$?
          "$BIN" health --fixture ./fixtures/incident_checkout --strict >/dev/null
          strict_inc=$?
          "$BIN" watch checkout --fixture ./fixtures/incident_checkout --once >/dev/null
          once_deg=$?
          set -e
          test "$vrb" -eq 1
          test "$strict_inc" -eq 1
          test "$once_deg" -eq 1
      - name: Full CLI smoke (ubuntu)
        if: ${{ matrix.smoke == 'full' }}
        shell: bash
        run: |
          set -euo pipefail
          BIN=./bin/opsgraph
          # Critical contracts only - broad command coverage lives in Go tests (features_test).
          out="$("$BIN" version 2>/tmp/version.err)"
          if [ -s /tmp/version.err ]; then
            echo "version wrote to stderr:" >&2
            cat /tmp/version.err >&2
            exit 1
          fi
          test -n "$out"

          "$BIN" ask checkout --fixture ./fixtures/incident_checkout --format json >/dev/null
          set +e
          "$BIN" ask nosuch --fixture ./fixtures/incident_checkout >/dev/null
          c1=$?
          "$BIN" ask checkout >/dev/null
          c2=$?
          "$BIN" verify-runbook checkout --fixture ./fixtures/incident_checkout >/dev/null
          c3=$?
          set -e
          test "$c1" -eq 1
          test "$c2" -eq 2
          test "$c3" -eq 1
          "$BIN" verify-runbook auth --fixture ./fixtures/incident_checkout >/dev/null
          "$BIN" handoff checkout --fixture ./fixtures/incident_checkout >/dev/null
          "$BIN" why checkout --fixture ./fixtures/incident_checkout >/dev/null
          "$BIN" fingerprint checkout --fixture ./fixtures/incident_checkout >/dev/null
          "$BIN" score checkout --fixture ./fixtures/incident_checkout --format json >/dev/null
          JA=(go run ./scripts/jsonassert.go)
          AI_JSON="$("$BIN" ask checkout --fixture ./fixtures/incident_checkout --ai --format json)"
          echo "$AI_JSON" | "${JA[@]}" has:ai_summary 'startswith:ai_summary=AI unavailable, deterministic result only'
          DATA="$(mktemp -d)"
          "$BIN" ingest --fixture ./fixtures/incident_checkout --data-dir "$DATA" --format json | "${JA[@]}" has:path has:counts eq:mode=fixture eqnum:schema=2 has:as_of
          "$BIN" ask checkout --data-dir "$DATA" --format json >/dev/null
          "$BIN" status --data-dir "$DATA" --format json | "${JA[@]}" has:counts has:schema_version has:active_source eq:active_source=persisted eqnum:schema_version=2 true:ok true:has_data
          EMPTY="$(mktemp -d)"
          set +e
          EMPTY_JSON="$("$BIN" status --data-dir "$EMPTY" --format json)"
          empty_status=$?
          set -e
          test "$empty_status" -eq 1
          echo "$EMPTY_JSON" | "${JA[@]}" false:ok false:has_data has:connectors has:ai
          "$BIN" doctor --format json | "${JA[@]}" has:checks has:ok has:warn has:fail true:pass
          "$BIN" version --format json | "${JA[@]}" has:version has:commit has:goos has:goarch
          "$BIN" graph --fixture ./fixtures/incident_checkout --format json | "${JA[@]}" has:nodes has:edges
          "$BIN" validate-fixture ./fixtures/incident_checkout --format json | "${JA[@]}" true:ok
          "$BIN" validate-fixture ./fixtures/fleet_healthy --format json | "${JA[@]}" true:ok
          "$BIN" changes --fixture ./fixtures/incident_checkout --format json --limit 1 | "${JA[@]}" has:changes has:truncated has:service true:truncated
          "$BIN" top --fixture ./fixtures/incident_checkout --format json --limit 1 | "${JA[@]}" has:services has:total
          "$BIN" services --fixture ./fixtures/incident_checkout --format json | "${JA[@]}" has:services has:total
          "$BIN" owners --fixture ./fixtures/incident_checkout --format json | "${JA[@]}" has:owners has:total
          "$BIN" test ./fixtures/incident_checkout --format json | "${JA[@]}" true:ok has:checked has:files
          "$BIN" why checkout --fixture ./fixtures/incident_checkout --format json | "${JA[@]}" has:why has:health has:score has:fingerprint
          "$BIN" score checkout --fixture ./fixtures/incident_checkout --format json | "${JA[@]}" has:service has:score has:level eq:level=critical eq:service=checkout gte:score=80
          "$BIN" path checkout-api auth --fixture ./fixtures/incident_checkout --format json | "${JA[@]}" has:from has:to has:nodes eq:from=checkout eq:to=auth true:ok true:found
          set +e
          PATH_MISS="$("$BIN" path auth order --fixture ./fixtures/incident_checkout --format json)"
          path_miss=$?
          set -e
          test "$path_miss" -eq 1
          echo "$PATH_MISS" | "${JA[@]}" false:ok false:found eq:from=auth eq:to=order
          "$BIN" watch order --fixture ./fixtures/incident_checkout --once --format json | "${JA[@]}" true:ok has:healthy true:healthy eq:service=order
          "$BIN" evidence --fixture ./fixtures/incident_checkout --format json --limit 1 | "${JA[@]}" has:evidence has:total gte:total=1
          EXP_META="$(mktemp -d)"
          "$BIN" export checkout --fixture ./fixtures/incident_checkout --format markdown --out "$EXP_META/r.md" --meta | "${JA[@]}" has:path has:bytes has:service eq:format=markdown eq:service=checkout gte:bytes=1
          "$BIN" compare checkout auth --fixture ./fixtures/incident_checkout --format json | "${JA[@]}" has:delta has:winner eq:winner=checkout eqnum:delta=45
          "$BIN" alerts --fixture ./fixtures/incident_checkout --format json --limit 1 | "${JA[@]}" has:alerts has:truncated
          "$BIN" handoff checkout --fixture ./fixtures/incident_checkout --format json | "${JA[@]}" has:note has:score has:fingerprint
          "$BIN" blast checkout --fixture ./fixtures/incident_checkout --format json | "${JA[@]}" has:upstream_count has:downstream_count has:upstream has:downstream gte:upstream_count=1 gte:downstream_count=1 eq:service=checkout
          # Machine contracts previously only covered in Go tests.
          "$BIN" ask checkout --fixture ./fixtures/incident_checkout --format json | "${JA[@]}" has:service has:timeline has:recommendations has:generated_at eq:window=60m
          "$BIN" verify-runbook auth --fixture ./fixtures/incident_checkout --format json | "${JA[@]}" has:service_id has:status has:steps eq:service_id=auth
          "$BIN" fingerprint checkout --fixture ./fixtures/incident_checkout --format json | "${JA[@]}" has:fingerprint has:service has:inputs startswith:fingerprint=inc_ eq:service=checkout
          "$BIN" report checkout --fixture ./fixtures/incident_checkout --format json | "${JA[@]}" has:markdown has:service has:health eq:service=checkout
          "$BIN" explain checkout --fixture ./fixtures/incident_checkout --format json | "${JA[@]}" has:narrative has:service has:health eq:service=checkout
          "$BIN" timeline checkout --fixture ./fixtures/incident_checkout --format json --limit 1 | "${JA[@]}" has:events has:total has:truncated true:truncated eq:service=checkout
          "$BIN" resolve checkout-api --fixture ./fixtures/incident_checkout --format json | "${JA[@]}" eq:id=checkout eq:query=checkout-api has:aliases
          "$BIN" who checkout --fixture ./fixtures/incident_checkout --format json | "${JA[@]}" eq:service=checkout has:owner_id has:last_author
          "$BIN" impact auth --fixture ./fixtures/incident_checkout --format json | "${JA[@]}" eq:root=auth has:affected has:tree has:max_depth
          "$BIN" demo --format json | "${JA[@]}" has:service has:timeline has:recommendations
          "$BIN" health --fixture ./fixtures/incident_checkout --format json | "${JA[@]}" false:ok has:counts has:by_state gte:total=1
          "$BIN" health --fixture ./fixtures/fleet_healthy --format json | "${JA[@]}" true:ok eqnum:total=2
          "$BIN" health --fixture ./fixtures/fleet_healthy --strict >/dev/null
          "$BIN" ask api --fixture ./fixtures/fleet_healthy --format json | "${JA[@]}" has:service has:recommendations
          "$BIN" verify-runbook api --fixture ./fixtures/fleet_healthy --format json | "${JA[@]}" eq:status=pass eq:service_id=api
          "$BIN" test ./fixtures/fleet_healthy --format json | "${JA[@]}" true:ok has:checked
          "$BIN" who api --fixture ./fixtures/fleet_healthy --format json | "${JA[@]}" eq:service=api has:owner_id eq:owner_id=platform
          "$BIN" score api --fixture ./fixtures/fleet_healthy --format json | "${JA[@]}" eq:service=api eq:level=low gte:score=0
          "$BIN" services --fixture ./fixtures/fleet_healthy --format json | "${JA[@]}" eqnum:total=2 has:services
          "$BIN" resolve api-gateway --fixture ./fixtures/fleet_healthy --format json | "${JA[@]}" eq:id=api eq:query=api-gateway true:ok
          "$BIN" impact db --fixture ./fixtures/fleet_healthy --format json | "${JA[@]}" eq:root=db has:affected gte:max_depth=1
          "$BIN" owners --fixture ./fixtures/fleet_healthy --format json | "${JA[@]}" eqnum:total=1 has:owners
          "$BIN" graph --fixture ./fixtures/fleet_healthy --format json | "${JA[@]}" has:nodes has:edges
          "$BIN" path api db --fixture ./fixtures/fleet_healthy --format json | "${JA[@]}" true:ok true:found eq:from=api eq:to=db eqnum:hops=1
          "$BIN" evidence --fixture ./fixtures/fleet_healthy --format json | "${JA[@]}" has:evidence eqnum:total=0 false:truncated
          "$BIN" compare api db --fixture ./fixtures/fleet_healthy --format json | "${JA[@]}" has:delta has:winner eq:winner=tie eqnum:delta=0
          "$BIN" status --fixture ./fixtures/fleet_healthy --format json | "${JA[@]}" true:ok true:has_data eq:active_source=fixture
          set +e
          "$BIN" health --fixture ./fixtures/incident_checkout --strict >/dev/null
          strict_health=$?
          "$BIN" watch checkout --fixture ./fixtures/incident_checkout --once >/dev/null
          once_degraded=$?
          set -e
          test "$strict_health" -eq 1
          test "$once_degraded" -eq 1
          "$BIN" watch order --fixture ./fixtures/incident_checkout --once >/dev/null
          # Env-only source contracts (no flags).
          OPSGRAPH_FIXTURE=./fixtures/incident_checkout "$BIN" ask checkout --format json >/dev/null
          OPSGRAPH_DATA_DIR="$DATA" "$BIN" status --format json >/dev/null
          OPSGRAPH_CONFIG=fixtures/ci_live_k8s/.opsgraph.yaml "$BIN" ask checkout --format json >/dev/null
          # Offline-first runtime proof: forced proxy blackhole must not break fixture path.
          (
            export http_proxy=http://127.0.0.1:9
            export https_proxy=http://127.0.0.1:9
            export HTTP_PROXY=http://127.0.0.1:9
            export HTTPS_PROXY=http://127.0.0.1:9
            export ALL_PROXY=http://127.0.0.1:9
            export NO_PROXY=
            "$BIN" test ./fixtures/incident_checkout >/dev/null
            "$BIN" validate-fixture ./fixtures/fleet_healthy >/dev/null
            "$BIN" ask checkout --fixture ./fixtures/incident_checkout --format json >/dev/null
            "$BIN" doctor >/dev/null
            "$BIN" demo >/dev/null
          )
          "$BIN" watch order --fixture ./fixtures/incident_checkout --interval 1ms --timeout 2s >/dev/null
          # Completion scripts must generate for all supported shells.
          for sh in bash zsh fish powershell; do
            out="$("$BIN" completion "$sh")"
            test -n "$out"
          done
          MERGE="$(mktemp -d)"
          "$BIN" ingest --config fixtures/ci_live_k8s/.opsgraph.yaml --data-dir "$MERGE" --replace >/dev/null
          "$BIN" ingest --config fixtures/ci_live_k8s/.opsgraph.yaml --data-dir "$MERGE" --merge >/dev/null
          "$BIN" ask checkout --data-dir "$MERGE" --format json >/dev/null
          EXP="$(mktemp -d)"
          "$BIN" export checkout --fixture ./fixtures/incident_checkout --format markdown --out "$EXP/r.md" >/dev/null
          test -s "$EXP/r.md"
          CFGDIR="$(mktemp -d)"
          cp .opsgraph.example.yaml "$CFGDIR/.opsgraph.yaml"
          BIN_ABS="$GITHUB_WORKSPACE/bin/opsgraph"
          (cd "$CFGDIR" && "$BIN_ABS" doctor --config .opsgraph.yaml >/dev/null)
          # Live k8s connector without --data-dir (must not require prior ingest).
          "$BIN_ABS" ask checkout --config fixtures/ci_live_k8s/.opsgraph.yaml --format json >/dev/null
          "$BIN_ABS" status --config fixtures/ci_live_k8s/.opsgraph.yaml >/dev/null
          "$BIN_ABS" doctor --config fixtures/ci_live_k8s/.opsgraph.yaml >/dev/null
          "$BIN_ABS" validate-fixture ./fixtures/incident_checkout >/dev/null
          "$BIN_ABS" alerts --fixture ./fixtures/incident_checkout --service checkout --firing >/dev/null
          "$BIN_ABS" alerts --fixture ./fixtures/incident_checkout --since 1h >/dev/null
          "$BIN_ABS" top --fixture ./fixtures/incident_checkout >/dev/null
          "$BIN" export checkout --fixture ./fixtures/incident_checkout --format markdown --out "$EXP/r.md" >/dev/null
          set +e
          "$BIN" watch checkout --fixture ./fixtures/incident_checkout --interval -1s --timeout 1s >/dev/null
          bad_watch=$?
          set -e
          test "$bad_watch" -eq 2
          "$BIN" compare checkout auth --fixture ./fixtures/incident_checkout --format json >/dev/null
          "$BIN" services --fixture ./fixtures/incident_checkout --health degraded --format json >/dev/null
          # File redirect (not pipes): cobra historically wrote Print* to stderr.
          MERMAID="$(mktemp)"
          MERMAID_ERR="$(mktemp)"
          "$BIN" graph --fixture ./fixtures/incident_checkout --format mermaid >"$MERMAID" 2>"$MERMAID_ERR"
          test -s "$MERMAID"
          test ! -s "$MERMAID_ERR"
          grep -F flowchart "$MERMAID" >/dev/null
          set +e
          "$BIN" services --fixture ./fixtures/incident_checkout --health nope >/dev/null
          bad_health=$?
          "$BIN" ask checkout --fixture ./fixtures/incident_checkout --since=-1h >/dev/null
          bad_since=$?
          set -e
          test "$bad_health" -eq 2
          test "$bad_since" -eq 2
      - name: Job summary
        if: always()
        shell: bash
        env:
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_RACE: ${{ matrix.race }}
          MATRIX_SMOKE: ${{ matrix.smoke }}
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo "## test (${MATRIX_OS})"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| race | ${MATRIX_RACE} |"
            echo "| smoke | ${MATRIX_SMOKE} |"
            echo "| result | ${JOB_STATUS} |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: go install smoke
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: |
          set -euo pipefail
          go install ./cmd/opsgraph
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          opsgraph version >/dev/null
          opsgraph ask checkout --fixture ./fixtures/incident_checkout --format json >/dev/null
      - name: install.sh from local dist + release archive (macos)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/install.sh
          mkdir -p dist
          arch="$(uname -m)"
          case "$arch" in
            x86_64|amd64) arch=amd64 ;;
            aarch64|arm64) arch=arm64 ;;
            *) echo "unsupported arch: $arch" >&2; exit 1 ;;
          esac
          cp bin/opsgraph "dist/opsgraph-darwin-${arch}"
          INSTALL_DIR="$(mktemp -d)"
          OPSGRAPH_DIST_DIR="$PWD/dist" OPSGRAPH_INSTALL_DIR="$INSTALL_DIR" ./scripts/install.sh
          "$INSTALL_DIR/opsgraph" version

          # Release-shaped install path (tar.gz + SHA256SUMS) used by real macOS users.
          REL_VERSION="v0.0.0-ci"
          REL="$(mktemp -d)"
          base="opsgraph_${REL_VERSION}_darwin_${arch}"
          cp bin/opsgraph "${REL}/${base}"
          tar -czf "${REL}/${base}.tar.gz" -C "$REL" "$base"
          rm -f "${REL}/${base}"
          (
            cd "$REL"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "${base}.tar.gz" > SHA256SUMS
            else
              shasum -a 256 "${base}.tar.gz" > SHA256SUMS
            fi
          )
          INSTALL_REL="$(mktemp -d)"
          OPSGRAPH_RELEASE_DIR="$REL" OPSGRAPH_VERSION="$REL_VERSION" OPSGRAPH_INSTALL_DIR="$INSTALL_REL" ./scripts/install.sh
          "$INSTALL_REL/opsgraph" version
      - name: install.ps1 from local dist + release zip (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $src = if (Test-Path bin/opsgraph.exe) { "bin/opsgraph.exe" } else { "bin/opsgraph" }
          $arch = switch -Regex ($env:RUNNER_ARCH) {
            "X64|AMD64" { "amd64" }
            "ARM64" { "arm64" }
            default { "amd64" }
          }
          Copy-Item $src "dist/opsgraph-windows-$arch.exe"

          $installDir = Join-Path $env:RUNNER_TEMP "opsgraph-install-dist"
          $env:OPSGRAPH_DIST_DIR = (Resolve-Path dist).Path
          $env:OPSGRAPH_INSTALL_DIR = $installDir
          Remove-Item Env:OPSGRAPH_RELEASE_DIR -ErrorAction SilentlyContinue
          ./scripts/install.ps1
          & "$installDir/opsgraph.exe" version

          $ver = "v0.0.0-ci"
          $rel = Join-Path $env:RUNNER_TEMP "opsgraph-release-win"
          New-Item -ItemType Directory -Force -Path $rel | Out-Null
          $exeName = "opsgraph_${ver}_windows_${arch}.exe"
          $zipName = "opsgraph_${ver}_windows_${arch}.zip"
          Copy-Item $src (Join-Path $rel $exeName)
          Compress-Archive -Path (Join-Path $rel $exeName) -DestinationPath (Join-Path $rel $zipName) -Force
          Remove-Item (Join-Path $rel $exeName)
          $hash = (Get-FileHash -Algorithm SHA256 -Path (Join-Path $rel $zipName)).Hash.ToLower()
          Set-Content -Path (Join-Path $rel "SHA256SUMS") -Value "$hash  $zipName"
          $installRel = Join-Path $env:RUNNER_TEMP "opsgraph-install-release"
          Remove-Item Env:OPSGRAPH_DIST_DIR -ErrorAction SilentlyContinue
          $env:OPSGRAPH_RELEASE_DIR = $rel
          $env:OPSGRAPH_VERSION = $ver
          $env:OPSGRAPH_INSTALL_DIR = $installRel
          ./scripts/install.ps1
          & "$installRel/opsgraph.exe" version

  cross:
    name: cross + release-pack
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - name: Cross-compile 6 targets (parallel) + pack
        env:
          # Stripped linux binaries today ~14MB; fail if a dep bloats past 22MB.
          SIZE_BUDGET_BYTES: "23068672"
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="ci-${GITHUB_SHA::7}"
          LDFLAGS="-s -w -buildid= -X github.com/sanjeev0120test/opsgraph/internal/version.Version=${VERSION} -X github.com/sanjeev0120test/opsgraph/internal/version.Commit=${GITHUB_SHA} -X github.com/sanjeev0120test/opsgraph/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          pids=()
          for pair in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS="${pair%/*}"
            GOARCH="${pair#*/}"
            out="dist/opsgraph-${GOOS}-${GOARCH}"
            if [ "$GOOS" = windows ]; then out="${out}.exe"; fi
            GOOS="$GOOS" GOARCH="$GOARCH" GOFLAGS="-mod=readonly -buildvcs=false" \
              go build -trimpath -ldflags "$LDFLAGS" -o "$out" ./cmd/opsgraph &
            pids+=($!)
          done
          for pid in "${pids[@]}"; do
            wait "$pid" || exit 1
          done
          shopt -s nullglob
          built=(dist/opsgraph-*)
          shopt -u nullglob
          test "${#built[@]}" -eq 6
          for pair in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS="${pair%/*}"
            GOARCH="${pair#*/}"
            f="dist/opsgraph-${GOOS}-${GOARCH}"
            if [ "$GOOS" = windows ]; then f="${f}.exe"; fi
            meta="$(go version -m "$f")"
            echo "$meta" | grep -F "GOOS=${GOOS}" >/dev/null
            echo "$meta" | grep -F "GOARCH=${GOARCH}" >/dev/null
            echo "$meta" | grep -F "github.com/sanjeev0120test/opsgraph/cmd/opsgraph" >/dev/null
          done
          for f in dist/opsgraph-linux-amd64 dist/opsgraph-linux-arm64; do
            bytes="$(wc -c < "$f")"
            echo "size ${f}=${bytes}"
            if [ "$bytes" -gt "$SIZE_BUDGET_BYTES" ]; then
              echo "::error::binary size budget exceeded for ${f}: ${bytes} > ${SIZE_BUDGET_BYTES}"
              exit 1
            fi
          done
          # Pure-Go static proof: ldd must fail (not a dynamic executable).
          if ldd ./dist/opsgraph-linux-amd64 >/tmp/ldd.out 2>&1; then
            echo "::error::linux/amd64 binary is dynamically linked (want CGO_ENABLED=0 static)"
            cat /tmp/ldd.out
            exit 1
          fi
          # Empty buildid on every cross target (reproducible release stamp).
          for f in dist/opsgraph-*; do
            bid="$(go tool buildid "$f")"
            if [ -n "$bid" ]; then
              echo "::error::non-empty buildid on ${f}: ${bid}"
              exit 1
            fi
          done
          ./dist/opsgraph-linux-amd64 version | grep -F "$VERSION"

          chmod +x scripts/install.sh scripts/pack-release.sh
          INSTALL_DIR="$(mktemp -d)"
          OPSGRAPH_DIST_DIR="$PWD/dist" OPSGRAPH_INSTALL_DIR="$INSTALL_DIR" ./scripts/install.sh
          "$INSTALL_DIR/opsgraph" version >/dev/null

          REL_VERSION="v0.0.0-ci"
          export SOURCE_DATE_EPOCH=1704067200
          ./scripts/pack-release.sh "$REL_VERSION" dist dist-release
          # Same inputs must yield identical SHA256SUMS (reproducible archives).
          ./scripts/pack-release.sh "$REL_VERSION" dist dist-release-b
          cmp -s dist-release/SHA256SUMS dist-release-b/SHA256SUMS
          go run ./scripts/jsonassert.go islist < dist-release/sbom.gomod.json
          tmp="$(mktemp -d)"
          tar -xzf "dist-release/opsgraph_${REL_VERSION}_linux_amd64.tar.gz" -C "$tmp"
          "$tmp/opsgraph_${REL_VERSION}_linux_amd64" ask checkout --fixture "$GITHUB_WORKSPACE/fixtures/incident_checkout" --format json >/dev/null
          INSTALL_REL="$(mktemp -d)"
          OPSGRAPH_RELEASE_DIR="$PWD/dist-release" OPSGRAPH_VERSION="$REL_VERSION" OPSGRAPH_INSTALL_DIR="$INSTALL_REL" ./scripts/install.sh
          "$INSTALL_REL/opsgraph" version >/dev/null
          # No artifact upload here: avoids cache-poisoning risk with actions/cache,
          # and GitHub Releases (release.yml) are the real binary distribution channel.

  vuln:
    name: govulncheck
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - name: Run govulncheck (source + binary, go tool)
        run: |
          set -euo pipefail
          # Pinned via go.mod tool directive (module graph + go.sum).
          go tool govulncheck ./...
          # Binary mode on the stripped release shape; allowlist is explicit review only.
          test -s scripts/govulncheck-allowlist.txt
          go build -o /dev/null scripts/check_govuln_binary.go
          vuln_bin="${RUNNER_TEMP}/opsgraph-vuln"
          GOFLAGS="-mod=readonly -buildvcs=false" \
            go build -trimpath -ldflags="-s -w -buildid=" -o "$vuln_bin" ./cmd/opsgraph
          go run ./scripts/check_govuln_binary.go "$vuln_bin"
          echo "| govulncheck source+binary (allowlisted) | ok |" >> "$GITHUB_STEP_SUMMARY"

  arm64-smoke:
    name: linux/arm64 smoke
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
      - name: Native arm64 build + smoke
        run: |
          set -euo pipefail
          test "$(go env GOARCH)" = "arm64"
          go build -trimpath -ldflags="-s -w -buildid=" -o bin/opsgraph ./cmd/opsgraph
          go test -count=1 -timeout=3m -short -shuffle=on ./...
          ./bin/opsgraph test ./fixtures/incident_checkout
          ./bin/opsgraph validate-fixture ./fixtures/fleet_healthy
          JA=(go run ./scripts/jsonassert.go)
          ./bin/opsgraph ask checkout --fixture ./fixtures/incident_checkout --format json | "${JA[@]}" has:service has:timeline
          ./bin/opsgraph health --fixture ./fixtures/fleet_healthy --format json | "${JA[@]}" true:ok
          ./bin/opsgraph health --fixture ./fixtures/fleet_healthy --strict >/dev/null
          bytes="$(wc -c < bin/opsgraph)"
          echo "native arm64 binary bytes=${bytes}"
          test "$bytes" -gt 1000000
          test "$bytes" -lt 23068672
          {
            echo "## linux/arm64 smoke"
            echo ""
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| goarch | arm64 |"
            echo "| binary_bytes | ${bytes} |"
            echo "| result | ok |"
          } >> "$GITHUB_STEP_SUMMARY"

  repro:
    name: repro-build
    uses: ./.github/workflows/repro-build.yml
    permissions:
      contents: read

  # Reusable security/workflow scanners - required by the aggregator.
  gitleaks:
    name: gitleaks
    uses: ./.github/workflows/gitleaks.yml
    permissions:
      contents: read
  zizmor:
    name: zizmor
    uses: ./.github/workflows/zizmor.yml
    permissions:
      contents: read
      actions: read
  actionlint:
    name: actionlint
    uses: ./.github/workflows/actionlint.yml
    permissions:
      contents: read
  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/dependency-review.yml
    permissions:
      contents: read
      pull-requests: write

  ci-ok:
    name: all checks passed
    needs: [lint, staticcheck, test, cross, vuln, arm64-smoke, repro, gitleaks, zizmor, actionlint, dependency-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    if: always()
    steps:
      - name: Aggregate job results
        run: |
          set -euo pipefail
          {
            echo "## all checks passed"
            echo ""
            echo "| job | result |"
            echo "| --- | --- |"
            echo "| lint | ${{ needs.lint.result }} |"
            echo "| staticcheck | ${{ needs.staticcheck.result }} |"
            echo "| test (3-OS matrix) | ${{ needs.test.result }} |"
            echo "| cross + release-pack | ${{ needs.cross.result }} |"
            echo "| govulncheck | ${{ needs.vuln.result }} |"
            echo "| linux/arm64 smoke | ${{ needs.arm64-smoke.result }} |"
            echo "| repro-build | ${{ needs.repro.result }} |"
            echo "| gitleaks | ${{ needs.gitleaks.result }} |"
            echo "| zizmor | ${{ needs.zizmor.result }} |"
            echo "| actionlint | ${{ needs.actionlint.result }} |"
            echo "| dependency-review | ${{ needs.dependency-review.result }} |"
            echo ""
            echo "CodeQL runs on PRs/schedule via \`codeql.yml\` (advisory; not in this aggregator to keep push wall-clock lean)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "lint=${{ needs.lint.result }}"
          echo "staticcheck=${{ needs.staticcheck.result }}"
          echo "test=${{ needs.test.result }}"
          echo "cross=${{ needs.cross.result }}"
          echo "vuln=${{ needs.vuln.result }}"
          echo "arm64-smoke=${{ needs.arm64-smoke.result }}"
          echo "repro=${{ needs.repro.result }}"
          echo "gitleaks=${{ needs.gitleaks.result }}"
          echo "zizmor=${{ needs.zizmor.result }}"
          echo "actionlint=${{ needs.actionlint.result }}"
          echo "dependency-review=${{ needs.dependency-review.result }}"
          test "${{ needs.lint.result }}" = "success"
          test "${{ needs.staticcheck.result }}" = "success"
          test "${{ needs.test.result }}" = "success"
          test "${{ needs.cross.result }}" = "success"
          test "${{ needs.vuln.result }}" = "success"
          test "${{ needs.arm64-smoke.result }}" = "success"
          test "${{ needs.repro.result }}" = "success"
          test "${{ needs.gitleaks.result }}" = "success"
          test "${{ needs.zizmor.result }}" = "success"
          test "${{ needs.actionlint.result }}" = "success"
          # PR-only job: skipped on push/schedule must still count as pass.
          test "${{ needs.dependency-review.result }}" = "success" || test "${{ needs.dependency-review.result }}" = "skipped"
          echo "all required CI jobs passed"
