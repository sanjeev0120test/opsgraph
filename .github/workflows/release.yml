name: release

# Automated secure delivery for every v* tag:
# - build 6 GOOS/GOARCH targets (no CGO)
# - package archives + LICENSE + installers + DEPENDENCIES + SHA256SUMS
# - attest provenance
# - publish a GitHub Release
#
# Precompiled binaries are NEVER committed to git; Releases are the only
# distribution channel for binaries.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build artifacts without publishing (always true for non-tag dispatch)'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

concurrency:
  # Global gate so two tags cannot race on make_latest / release assets.
  # Never cancel an in-flight publish - a second tag push must wait.
  group: release-publish
  cancel-in-progress: false

env:
  GOTOOLCHAIN: local
  CGO_ENABLED: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: build-release-binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      make_latest: ${{ steps.meta.outputs.make_latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        with:
          cache: 'false'
      - name: Resolve version metadata
        id: meta
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
            if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
              echo "tag $VERSION does not look like a semver release (vX.Y.Z)" >&2
              exit 1
            fi
          else
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          PRERELEASE=false
          MAKE_LATEST=true
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE=true
            MAKE_LATEST=false
          fi
          # Reproducible stamp: commit committer unix time (not wall-clock build time).
          EPOCH="$(git -c log.showSignature=false show -s --format=%ct "${GITHUB_SHA}")"
          DATE="$(date -u -d "@${EPOCH}" +%Y-%m-%dT%H:%M:%SZ)"
          {
            echo "version=${VERSION}"
            echo "prerelease=${PRERELEASE}"
            echo "make_latest=${MAKE_LATEST}"
            echo "commit=${GITHUB_SHA}"
            echo "date=${DATE}"
            echo "epoch=${EPOCH}"
          } >> "$GITHUB_OUTPUT"
      - name: Run unit + fixture gates before packaging
        env:
          CGO_ENABLED: "1"
        run: |
          set -euo pipefail
          # Match CI race + determinism contracts before publishing binaries.
          go test -race ./...
          go run ./cmd/opsgraph test ./fixtures/incident_checkout
          go run ./cmd/opsgraph demo --format json >/dev/null
          A="$(mktemp)"; B="$(mktemp)"
          go run ./cmd/opsgraph ask checkout --fixture ./fixtures/incident_checkout --format json >"$A"
          go run ./cmd/opsgraph ask checkout --fixture ./fixtures/incident_checkout --format json >"$B"
          cmp -s "$A" "$B"
      - name: Build multi-arch release binaries
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          COMMIT: ${{ steps.meta.outputs.commit }}
          DATE: ${{ steps.meta.outputs.date }}
        run: |
          set -euo pipefail
          mkdir -p binaries
          LDFLAGS="-s -w -buildid= -X github.com/sanjeev0120test/opsgraph/internal/version.Version=${VERSION} -X github.com/sanjeev0120test/opsgraph/internal/version.Commit=${COMMIT} -X github.com/sanjeev0120test/opsgraph/internal/version.Date=${DATE}"
          pids=()
          for pair in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS="${pair%/*}"
            GOARCH="${pair#*/}"
            out="binaries/opsgraph_${VERSION}_${GOOS}_${GOARCH}"
            if [ "$GOOS" = windows ]; then out="${out}.exe"; fi
            echo "building $out"
            GOOS="$GOOS" GOARCH="$GOARCH" go build -trimpath -ldflags "$LDFLAGS" -o "$out" ./cmd/opsgraph &
            pids+=($!)
          done
          for pid in "${pids[@]}"; do
            wait "$pid" || exit 1
          done
          for f in "binaries/opsgraph_${VERSION}_"*; do
            test -s "$f"
          done
      - name: Package release archives (shared script)
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          SOURCE_DATE_EPOCH: ${{ steps.meta.outputs.epoch }}
        run: |
          set -euo pipefail
          chmod +x scripts/pack-release.sh
          ./scripts/pack-release.sh "$VERSION" binaries dist
      - name: Smoke-test linux/amd64 archive + install.sh
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="${VERSION//$'\r'/}"
          chmod +x scripts/install.sh
          archive="dist/opsgraph_${VERSION}_linux_amd64.tar.gz"
          test -s "$archive"
          tmp="$(mktemp -d)"
          tar -xzf "$archive" -C "$tmp"
          bin="$tmp/opsgraph_${VERSION}_linux_amd64"
          test -x "$bin"
          out="$("$bin" version)"
          echo "version-output: $out"
          if [[ "$out" != *"$VERSION"* ]]; then
            echo "release binary version stdout does not contain $VERSION" >&2
            exit 1
          fi
          "$bin" ask checkout --fixture "${GITHUB_WORKSPACE}/fixtures/incident_checkout" --format json >/dev/null
          set +e
          doctor_out="$("$bin" doctor 2>&1)"
          doctor_code=$?
          set -e
          echo "$doctor_out"
          test "$doctor_code" -eq 0
          # Install from release-shaped directory (checksum-verified archives).
          INSTALL_DIR="$(mktemp -d)"
          OPSGRAPH_RELEASE_DIR="$PWD/dist" OPSGRAPH_VERSION="$VERSION" OPSGRAPH_INSTALL_DIR="$INSTALL_DIR" ./scripts/install.sh
          "$INSTALL_DIR/opsgraph" version
          "$INSTALL_DIR/opsgraph" ask checkout --fixture "${GITHUB_WORKSPACE}/fixtures/incident_checkout" --format json >/dev/null
      - name: Smoke-test windows/amd64 zip integrity
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          VERSION="${VERSION//$'\r'/}"
          zip="dist/opsgraph_${VERSION}_windows_amd64.zip"
          test -s "$zip"
          tmp="$(mktemp -d)"
          # unzip is available on ubuntu-latest; validates zip structure without YAML multiline pitfalls.
          unzip -l "$zip" | grep -E '\.exe$' >/dev/null
          unzip -q -o "$zip" -d "$tmp"
          test -s "$tmp/opsgraph_${VERSION}_windows_amd64.exe"
          # Darwin archive integrity (list only; cannot execute on linux runner).
          dar="dist/opsgraph_${VERSION}_darwin_arm64.tar.gz"
          test -s "$dar"
          tar -tzf "$dar" | grep -F "opsgraph_${VERSION}_darwin_arm64" >/dev/null
      - name: Upload release assets (artifact)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: opsgraph-release-${{ steps.meta.outputs.version }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
            dist/DEPENDENCIES.txt
            dist/sbom.gomod.json
            dist/LICENSE
            dist/install.sh
            dist/install.ps1
          if-no-files-found: error
          retention-days: 14

  publish:
    name: publish-github-release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    permissions:
      contents: write
      id-token: write
      attestations: write
    if: >-
      github.ref_type == 'tag' &&
      (github.event_name != 'workflow_dispatch' || inputs.dry_run == 'false')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: opsgraph-release-${{ needs.build.outputs.version }}
          path: dist
      - name: Verify release asset set
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          cd dist
          for f in \
            "opsgraph_${VERSION}_linux_amd64.tar.gz" \
            "opsgraph_${VERSION}_linux_arm64.tar.gz" \
            "opsgraph_${VERSION}_darwin_amd64.tar.gz" \
            "opsgraph_${VERSION}_darwin_arm64.tar.gz" \
            "opsgraph_${VERSION}_windows_amd64.zip" \
            "opsgraph_${VERSION}_windows_arm64.zip" \
            SHA256SUMS DEPENDENCIES.txt sbom.gomod.json LICENSE install.sh install.ps1
          do
            test -s "$f"
          done
          sha256sum -c SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
            dist/DEPENDENCIES.txt
            dist/sbom.gomod.json
            dist/LICENSE
            dist/install.sh
            dist/install.ps1
      - name: Create GitHub Release
        # Pin commit (v3.0.2) - floating majors are supply-chain risk.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name: ${{ needs.build.outputs.version }}
          draft: false
          prerelease: ${{ needs.build.outputs.prerelease == 'true' }}
          make_latest: ${{ needs.build.outputs.make_latest == 'true' }}
          generate_release_notes: true
          body: |
            ## opsgraph ${{ needs.build.outputs.version }}

            Precompiled binaries for **linux / darwin / windows x amd64 / arm64**.

            - Binaries are distributed **only** via GitHub Releases (never committed to the git source tree).
            - Verify downloads with `SHA256SUMS` before running installers.
            - Module SBOM: `sbom.gomod.json` (from `go list -m -json all`).
            - Provenance attestation is attached to this release.
            - Installers: `install.sh` (Unix) and `install.ps1` (Windows).

            ```bash
            VERSION=${{ needs.build.outputs.version }}
            curl -fsSL "https://github.com/sanjeev0120test/opsgraph/releases/download/${VERSION}/SHA256SUMS" -o SHA256SUMS
            curl -fsSL "https://github.com/sanjeev0120test/opsgraph/releases/download/${VERSION}/install.sh" -o install.sh
            sha256sum -c SHA256SUMS --ignore-missing
            chmod +x install.sh
            OPSGRAPH_VERSION="$VERSION" ./install.sh
            ```
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
            dist/DEPENDENCIES.txt
            dist/sbom.gomod.json
            dist/LICENSE
            dist/install.sh
            dist/install.ps1
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
