name: dependency-review

# PR dependency advisory scan. Invoked from ci.yml (workflow_call) so it
# participates in "all checks passed" on pull_request; skipped on push.

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  dependency-review:
    name: review deps
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5
        with:
          fail-on-severity: high
          # MIT offline CLI: allowlist only (action forbids allow-licenses + deny-licenses together).
          # LicenseRef-scancode-google-patent-license-golang is the Go patent grant
          # on golang.org/x/*; GitHub now reports it as AND with BSD-3-Clause.
          allow-licenses: >-
            MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MPL-2.0, 0BSD,
            Unlicense, CC0-1.0, BlueOak-1.0.0, PostgreSQL, Zlib, BSL-1.0,
            LicenseRef-scancode-google-patent-license-golang
          # GitHub's license graph lags new Go module versions. Wildcard so a
          # patch bump does not fail CI before the catalog indexes the tag.
          # Licenses verified from upstream: BSD-3-Clause (modernc) / MIT (go-isatty).
          allow-dependencies-licenses: >
            pkg:golang/modernc.org/sqlite@*,
            pkg:golang/modernc.org/libc@*,
            pkg:golang/github.com/mattn/go-isatty@*
