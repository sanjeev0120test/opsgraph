# opsgraph configuration (copy to .opsgraph.yaml and edit).
# Everything here is optional: `opsgraph demo` and `opsgraph test` work with
# no config at all, using the built-in fixture defaults.
version: 1
data_dir: .opsgraph/data
default_since: 60m

services:
  checkout:
    aliases: ["checkout-api", "checkout-service"]
    owner: payments
    git_paths: ["services/checkout", "fixtures/incident_checkout"]
    k8s:
      deployments: ["checkout"]
      namespaces: ["default", "demo"]
    # Paths are relative to the config file's directory.
    runbook: configs/runbooks/checkout.md
    depends_on: ["auth", "redis"]
  auth:
    aliases: ["auth-svc", "auth-service"]
    owner: identity
    k8s:
      deployments: ["auth"]
    runbook: fixtures/incident_checkout/runbooks/auth.md

owners:
  payments:
    name: Payments Team
    email: payments@example.com
  identity:
    name: Identity Team

connectors:
  fixtures:
    enabled: true
  git:
    enabled: true
    repo_path: .
  kubernetes:
    # Pure-Go snapshot parser (no client-go). Native kubectl YAML or opsgraph dialect.
    #   kubectl get deploy,statefulset,daemonset,event -o yaml > k8s-snapshot.yaml
    enabled: false
    snapshot: "" # e.g. k8s-snapshot.yaml or fixtures/incident_checkout/k8s
  prometheus:
    # Optional: local Prometheus /api/v1/alerts (disabled by default; mocked in tests).
    enabled: false
    url: http://127.0.0.1:9090
  alertmanager:
    # Optional: local Alertmanager /api/v2/alerts (disabled by default; mocked in tests).
    enabled: false
    url: http://127.0.0.1:9093
  plugins:
    # Local commands that print opsgraph pack YAML on stdout. Never discovered
    # from PATH: only entries listed here run. Accepted sections:
    # services, owners, changes, dependencies, alerts.
    # - name: deploys
    #   command: ["./bin/opsgraph-deploys"]
    #   enabled: true
    #   timeout: 10s

ai:
  enabled: false
  ollama_url: http://127.0.0.1:11434
  model: qwen2.5:7b
  embed_model: nomic-embed-text
  timeout: 20s
